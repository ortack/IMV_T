{% extends "base.html" %}
{% load i18n %}
{% load static %}
{% block title %}Gestor IMV{% endblock %}
{% block head %}
<meta http-equiv="refresh" content="5;  "/>
{% endblock %}
{% block content %}
<div style="text-align: center;">
    <h3>Total Tarjetas: {{ tarjetas_count }}, Pendiente de Hospital: {{pendiente_hospi}}, Pendiente de traslado: {{pendiente_traslado}} </h3>
</div>
<div class="contenedor">
  <div map="map" id="map" style="width: 100%; height: 800px;"></div>
</div>
<script>
    var latitud = {{ latitud }}; // Latitud del evento
    var longitud = {{ longitud }}; // Longitud del evento

    // Crear el mapa
    var map = L.map('map').setView([latitud, longitud], 17.5);

    // Agregar capa de OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
        maxZoom: 30,
    }).addTo(map);

    // Iterar sobre tarjetas_red_coords para agregar marcadores rojos
    var tarjetasRedCoords = {{ tarjetas_red_coords|safe }};
    var tarjetasVerdeCoords = {{ tarjetas_verde_coords|safe }};
    var tarjetasAmarilloCoords = {{ tarjetas_amarillo_coords|safe }};
    var tarjetasMoradoCoords = {{ tarjetas_morado_coords|safe }};
    var tarjetasNegroCoords = {{ tarjetas_negro_coords|safe }};
    var psaCoords = {{ psa_coords|safe }};

    tarjetasRedCoords.forEach(function(tarjeta) {
        if (tarjeta.lat && tarjeta.lon) {
            var marker = L.marker([tarjeta.lat, tarjeta.lon], {
                icon: L.icon({
                    iconUrl: '{% static "/img/marker-icon-red.png" %}',
                    shadowUrl: '{% static "/img/marker-shadow.png" %}',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                })
            }).addTo(map);
            marker.bindTooltip(
                "Num tarjeta: " + (tarjeta.num_t || "N/A") +
                "<br>Edad: " + (tarjeta.edad || "N/A") +
                "<br>Sexo: " + (tarjeta.sexo || "N/A"),
                {direction: "top", offset: [0, -10], opacity: 0.9}
            );
        }
    });

    tarjetasVerdeCoords.forEach(function(tarjeta) {
        if (tarjeta.lat && tarjeta.lon) {
            var marker = L.marker([tarjeta.lat, tarjeta.lon], {
                icon: L.icon({
                    iconUrl: '{% static "/img/marker-icon-green.png" %}',
                    shadowUrl: '{% static "/img/marker-shadow.png" %}',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                })
            }).addTo(map);
            marker.bindTooltip(
                "Num tarjeta: " + (tarjeta.num_t || "N/A") +
                "<br>Edad: " + (tarjeta.edad || "N/A") +
                "<br>Sexo: " + (tarjeta.sexo || "N/A"),
                {direction: "top", offset: [0, -10], opacity: 0.9}
            );
        }
    });

    tarjetasAmarilloCoords.forEach(function(tarjeta) {
        if (tarjeta.lat && tarjeta.lon) {
            var marker = L.marker([tarjeta.lat, tarjeta.lon], {
                icon: L.icon({
                    iconUrl: '{% static "/img/marker-icon-yellow.png" %}',
                    shadowUrl: '{% static "/img/marker-shadow.png" %}',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                })
            }).addTo(map);
            marker.bindTooltip(
                "Num tarjeta: " + (tarjeta.num_t || "N/A") +
                "<br>Edad: " + (tarjeta.edad || "N/A") +
                "<br>Sexo: " + (tarjeta.sexo || "N/A"),
                {direction: "top", offset: [0, -10], opacity: 0.9}
            );
        }
    });

    tarjetasMoradoCoords.forEach(function(tarjeta) {
        if (tarjeta.lat && tarjeta.lon) {
            var marker = L.marker([tarjeta.lat, tarjeta.lon], {
                icon: L.icon({
                    iconUrl: '{% static "/img/marker-icon-blue.png" %}',
                    shadowUrl: '{% static "/img/marker-shadow.png" %}',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                })
            }).addTo(map);
            marker.bindTooltip(
                "Num tarjeta: " + (tarjeta.num_t || "N/A") +
                "<br>Edad: " + (tarjeta.edad || "N/A") +
                "<br>Sexo: " + (tarjeta.sexo || "N/A"),
                {direction: "top", offset: [0, -10], opacity: 0.9}
            );
        }
    });

    tarjetasNegroCoords.forEach(function(tarjeta) {
        if (tarjeta.lat && tarjeta.lon) {
            var marker = L.marker([tarjeta.lat, tarjeta.lon], {
                icon: L.icon({
                    iconUrl: '{% static "/img/marker-icon-black.png" %}',
                    shadowUrl: '{% static "/img/marker-shadow.png" %}',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                })
            }).addTo(map);
            marker.bindTooltip(
                "Num tarjeta: " + (tarjeta.num_t || "N/A") +
                "<br>Edad: " + (tarjeta.edad || "N/A") +
                "<br>Sexo: " + (tarjeta.sexo || "N/A"),
                {direction: "top", offset: [0, -10], opacity: 0.9}
            );
        }
    });

    psaCoords.forEach(function(psa) {
        if (psa.lat && psa.lon) {
            L.marker([psa.lat, psa.lon], {
                icon: L.icon({
                    iconUrl: '{% static "/img/hospital.png" %}',
                    iconSize: [40, 40],
                    iconAnchor: [12, 41]
                })
            }).addTo(map);
        }
    });

</script>
{% endblock %}
